http {
    server {
        listen 80;
        client_max_body_size 100M;

        # Container logs can contain user data and secrets, so the viewer is never public.
        # Create the password file next to docker-compose.logs.yml before starting:
        #   htpasswd -c logs.htpasswd <username>     (or: docker run --rm httpd:2 htpasswd -nbB <user> <password> > logs.htpasswd)
        # nginx refuses to start without it, so a missing file fails closed.
        auth_basic "Logs";
        auth_basic_user_file /etc/nginx/logs.htpasswd;

        location / {
            proxy_pass http://dozzle:8080;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


events {
  worker_connections   1000;
}