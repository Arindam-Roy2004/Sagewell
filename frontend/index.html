<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sagewell is a calm research workspace: add documents, notes and web pages, then ask questions and get answers that cite your sources." />
    <meta name="theme-color" content="#F9F6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)" />
    <title>Sagewell — chat with your sources</title>
    <!-- Apply the saved theme before first paint so there is no light/dark flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sagewell-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
