# Reverse proxy for the Sagewell API.
#
# Install (one time, on the VPS):
#   1. Get the certificate first. The default nginx site answers unknown hosts, so
#      the webroot method works without any Sagewell config in place yet:
#        certbot certonly --webroot -w /var/www/html -d sagewell-api.royarindam.page
#   2. Copy the files:
#        /etc/nginx/sites-available/sagewell.conf  (symlink into sites-enabled/)
#        /etc/nginx/snippets/sagewell-proxy.conf   (from infra/nginx/snippets/)
#   3. nginx -t && systemctl reload nginx
#
# The container binds 127.0.0.1:8080, so without this the API isn't reachable at
# all. This file only adds the sagewell-api host; the existing api.royarindam.page
# site is not touched. Certificates renew through the existing certbot timer.
#
# Written for nginx 1.24 (Ubuntu 24.04), which needs `listen 443 ssl http2`. On
# nginx >= 1.25.1 switch to `listen 443 ssl;` plus a separate `http2 on;` line.

# Coarse outer shell in front of the app's own rate limiters — drops a flood before
# it costs an event-loop slot. Both modules default to 503; the app answers its own
# limits with 429 and /api/v1/health uses 503 for "not ready", so keep them distinct.
limit_conn_zone $binary_remote_addr zone=sagewell_conn:10m;
limit_req_zone  $binary_remote_addr zone=sagewell_req:10m rate=30r/s;
limit_req_status 429;
limit_conn_status 429;

upstream sagewell_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sagewell-api.royarindam.page;

    # Must stay on plain HTTP or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sagewell-api.royarindam.page;

    ssl_certificate     /etc/letsencrypt/live/sagewell-api.royarindam.page/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sagewell-api.royarindam.page/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # The API parses JSON bodies only (default 100kb in express.json); file uploads go
    # straight from the browser to object storage, so nothing large reaches this server.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    # Every response here is proxied, so the default would skip all of them.
    gzip_proxied any;

    # Limits are per-location, not server-level: neither limit_req nor limit_conn
    # accepts `off`, and both are inherited by any location that doesn't set its
    # own — which would throttle the health endpoints and cause false rollbacks.
    location / {
        limit_conn sagewell_conn 20;
        limit_req  zone=sagewell_req burst=60 nodelay;

        include snippets/sagewell-proxy.conf;
    }

    # Health endpoints are unlimited so a throttled probe can't look like an outage.
    location = /api/v1/healthcheck {
        access_log off;
        include snippets/sagewell-proxy.conf;
    }

    location = /api/v1/health {
        access_log off;
        include snippets/sagewell-proxy.conf;
    }
}
