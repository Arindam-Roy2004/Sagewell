# Shared proxy settings. Included by every location in sagewell.conf so the
# headers don't drift between copies.
#
# Install: /etc/nginx/snippets/sagewell-proxy.conf

proxy_pass http://sagewell_api;
proxy_http_version 1.1;

# Overwrite rather than append: the app sets `trust proxy` to 1 hop, and the API's
# rate limiters are keyed on IP, so a client must not be able to prepend its own
# X-Forwarded-For entry.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Host $host;

# Needed for upstream keepalive; without it nginx sends Connection: close.
proxy_set_header Connection "";

# Chat answers stream token by token: never buffer them.
proxy_buffering off;
proxy_cache off;

proxy_connect_timeout 5s;
proxy_send_timeout 120s;
# Streamed answers can run long; the default 60s would cut them off.
proxy_read_timeout 300s;
